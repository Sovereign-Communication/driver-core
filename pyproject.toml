[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-core"
# The version is written here and in driver_core/__init__.py, and
# tests/test_service.py asserts the two agree -- `GET /health` reports the
# package's copy, and a wheel that disagreed with the service it ships would be
# a genuinely confusing bug to chase. A `[tool.setuptools.dynamic]` entry would
# remove the second copy instead, but it makes the build depend on importing
# the package, and a test catches the drift that actually matters without
# touching packaging.
# 3.4.0: the audit log's record vocabulary has one owner. Producers import
# audit.KIND_* rather than writing the string, KIND_CONSENT is deleted
# because nothing produced it, and states.FREE_CLASSES is deleted as a
# duplicate of observation.STRUCTURED_CLASSES. No record written changes --
# tests/test_audit_compat.py pins both an existing chain and a full run
# byte for byte.
# 3.3.0: an unquoted absolute Windows path works. The declared-command
# tokeniser was POSIX shlex, which read \ as an escape outside quotes, so
# C:\Python314\python.exe resolved to C:Python314python.exe -- disabling the
# cli and mcp tiers with an absolute interpreter path on Windows. The rule is
# now total: whitespace separates, quotes group, and a backslash is never an
# escape, so there are no escapes at all. One behaviour change: a POSIX
# operator using '\ ' to escape a space must now quote it instead.
# 3.2.0: a host can supply the REST token it will present (DRIVER_TOKEN), so
# the service is no longer reachable only by a caller that cannot hold a
# credential for it. `serve --print-token` becomes a query that binds nothing,
# `serve(port=0)` now means an ephemeral port instead of silently falling back
# to 8791, and `serve` reports the address it actually bound rather than the
# arguments it was given (`http://None:8791`). `/health` gains `version`.
# STOP_REASONS, StepResult.to_dict() and the request field set are unchanged.
# 3.1.0: each fact has one owner. The settings and the driver no longer both
# answer "which perception tiers are live" -- `/health` drops the
# `settings.sources` duplicate and its top-level `sources` is the answer -- the
# driver holds one list rather than a list plus a separate screen field, and
# "what does this wire `schema` mean" is decided in one place instead of
# separately in the CLI and the service. POST /step is unchanged: same fields,
# same STOP_REASONS, same StepResult.to_dict().
version = "3.4.0"
# 3.0.0: the perception tiers are reachable from the product. Sources are
# registered from declared DRIVER_* settings (DRIVER_CLI_COMMAND,
# DRIVER_MCP_COMMAND + DRIVER_MCP_TOOL, DRIVER_DOM_URL, DRIVER_SCREEN), and an
# absent or unrecognised `schema` on POST /step is a 400 rather than a silent
# default. Nothing was added to the response -- STOP_REASONS and
# StepResult.to_dict() are byte-identical to 2.x -- but a host that omitted
# `schema` used to receive a 200 built on an *undeclared* target class, and an
# undeclared class permits any source to answer with pixels last.
description = "Verified extraction -> Jev decision -> deterministic action, for driving a local machine safely."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agents", "system-one", "jev", "extraction", "consensus", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

# Deliberately zero. Every module in this package is stdlib-only, and that
# is a design constraint rather than an accident: the integration target is
# a host project that may have its own opinion about dependencies, and a
# driver that acts on a machine is a poor place to introduce a supply chain.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
driver-core = "driver_core.cli:main"

[project.urls]
Homepage = "https://github.com/Sovereign-Communication/driver-core"

[tool.setuptools]
packages = ["driver_core"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
